# Default kindnet does not enforce NetworkPolicy, so we disable it and
# install Calico in its place. Without this, every NetworkPolicy in k8s/
# is accepted by the API server and silently does nothing.
#
# podSubnet is 10.244.0.0/16, not the more common-looking 192.168.0.0/16:
# Docker Desktop's internal host network (host.docker.internal, used by
# `make demo-agent` to reach a model on the laptop) lives inside
# 192.168.0.0/16 on Windows and macOS (e.g. 192.168.127.254, 192.168.65.254).
# A pod subnet drawn from that same /16 makes the "except: pod network"
# clause in k8s/50-networkpolicy.yaml's agent-egress-model rule swallow the
# model traffic it's meant to allow — the agent can't reach the model at
# all, and it fails as a silent connect timeout, not an error that points
# at the cause. See README Troubleshooting.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agent-boundary
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
