# https://taskfile.dev  —  run `task` to list everything
version: "3"

vars:
  NS: agent-boundary
  CLUSTER: agent-boundary
  CALICO: https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml

  # Where the model lives, for `task demo-agent`. Defaults to Ollama on this
  # machine; the address is detected because a pod cannot say "localhost" and
  # mean your laptop. Override any of these on the command line:
  #
  #   task demo-agent MODEL_BASE_URL=https://api.example.com/v1 \
  #                   MODEL_NAME=some-model MODEL_API_KEY=sk-...
  HOST_IP:
    sh: |
      ip route get 1.1.1.1 2>/dev/null | awk '{print $7; exit}' | grep . \
        || ipconfig getifaddr en0 2>/dev/null \
        || echo host.docker.internal
  MODEL_BASE_URL: '{{.MODEL_BASE_URL | default (printf "http://%s:11434/v1" .HOST_IP)}}'
  MODEL_NAME: '{{.MODEL_NAME | default "llama3.2:3b"}}'
  MODEL_API_KEY: '{{.MODEL_API_KEY | default "not-needed"}}'

tasks:
  default:
    desc: list the tasks
    silent: true
    cmds:
      - task --list

  cluster:
    desc: create the kind cluster and install Calico (NetworkPolicy enforcement)
    cmds:
      - kind create cluster --config kind-config.yaml
      - kubectl apply -f {{.CALICO}}
      - echo "waiting for Calico..."
      - kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
      - kubectl wait --for=condition=Ready nodes --all --timeout=300s

  deploy:
    desc: apply the platform, tools, broker and agent
    cmds:
      - kubectl apply -f k8s/
      - kubectl -n {{.NS}} rollout status deploy/claims-api   --timeout=180s
      - kubectl -n {{.NS}} rollout status deploy/payments-api --timeout=180s
      - kubectl -n {{.NS}} rollout status deploy/tools-mcp    --timeout=180s
      - kubectl -n {{.NS}} rollout status deploy/tool-broker  --timeout=180s
      - kubectl -n {{.NS}} rollout status deploy/claims-agent --timeout=180s
      - echo "ready. 'task demo' runs the fixed sequence; 'task demo-agent' puts a real model in the loop."

  demo:
    desc: run the fixed-sequence agent — no model, no API key, deterministic
    cmds:
      - kubectl -n {{.NS}} delete pod -l app=claims-agent --ignore-not-found
      - kubectl -n {{.NS}} rollout status deploy/claims-agent --timeout=180s
      - sleep 12
      - kubectl -n {{.NS}} logs -l app=claims-agent --tail=-1

  model-check:
    desc: check a model endpoint is reachable before running demo-agent
    silent: true
    cmds:
      - echo "looking for a model at {{.MODEL_BASE_URL}}"
      - |
        curl -sS -m 5 -o /dev/null -w "  HTTP %{http_code}\n" {{.MODEL_BASE_URL}}/models || {
          echo "  not reachable."
          echo "  For a free local one:  OLLAMA_HOST=0.0.0.0 ollama serve"
          echo "                         ollama pull {{.MODEL_NAME}}"
          exit 1
        }

  demo-agent:
    desc: run with a REAL model deciding the tool calls (see model-check)
    cmds:
      - echo "model {{.MODEL_NAME}} at {{.MODEL_BASE_URL}}"
      - >-
        kubectl -n {{.NS}} create configmap model-config
        --from-literal=MODEL_BASE_URL={{.MODEL_BASE_URL}}
        --from-literal=MODEL_NAME={{.MODEL_NAME}}
        --from-literal=MODEL_API_KEY={{.MODEL_API_KEY}}
        --dry-run=client -o yaml | kubectl apply -f -
      - kubectl -n {{.NS}} scale deploy/claims-agent-llm --replicas=0
      - kubectl -n {{.NS}} scale deploy/claims-agent-llm --replicas=1
      - kubectl -n {{.NS}} rollout status deploy/claims-agent-llm --timeout=180s
      - echo "the agent will discover its tools from the MCP server via the broker"
      - echo "waiting for the model to work through the task..."
      - sleep 30
      - kubectl -n {{.NS}} logs -l app=claims-agent-llm --tail=-1

  mcp-tools:
    desc: what the MCP server advertises, and what policy actually permits
    silent: true
    cmds:
      - |
        kubectl -n {{.NS}} exec deploy/tool-broker -- python -c "
        import json,urllib.request
        r=urllib.request.Request('http://127.0.0.1:8081/tools',headers={'X-Agent-Identity':'claims-agent'})
        for t in json.loads(urllib.request.urlopen(r).read())['tools']:
            print('%-18s %s  %s' % (t['name'], 'ALLOW' if t['allowed'] else 'DENY ', t['policy']))
        "

  test:
    desc: run the whole flow as local processes — no cluster, no Docker, no model
    cmds:
      - python3 test/run_local.py

  audit:
    desc: show the broker's audit stream — every decision, allow and deny
    silent: true
    cmds:
      - kubectl -n {{.NS}} logs -l app=tool-broker --tail=-1 | grep '^AUDIT ' | sed 's/^AUDIT //'

  denials:
    desc: show only the refusals
    silent: true
    cmds:
      - kubectl -n {{.NS}} logs -l app=tool-broker --tail=-1 | grep '^AUDIT ' | sed 's/^AUDIT //' | grep '"DENY"'

  rbac:
    desc: prove the agent's service account cannot read secrets
    silent: true
    cmds:
      - echo "can claims-agent read secrets?"
      - kubectl -n {{.NS}} auth can-i get secrets --as=system:serviceaccount:{{.NS}}:claims-agent || true
      - echo "can claims-agent list pods?"
      - kubectl -n {{.NS}} auth can-i list pods --as=system:serviceaccount:{{.NS}}:claims-agent || true

  breach:
    desc: remove the network boundary and re-run — watch the bypass succeed
    cmds:
      - kubectl -n {{.NS}} delete networkpolicy --all
      - task: demo

  restore:
    desc: put the network boundary back
    cmds:
      - kubectl apply -f k8s/50-networkpolicy.yaml

  clean:
    desc: delete the cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER}}
